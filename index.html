<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>🏋️ ระบบจัดการสมาชิก</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        h1 { color: #1a237e; border-bottom: 3px solid #1a237e; padding-bottom: 10px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .btn-group button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .btn-sheet1 { background: #1565C0; }
        .btn-sheet2 { background: #2E7D32; }
        .btn-sheet3 { background: #E65100; }
        .btn-sheet4 { background: #6A1B9A; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; background: #e8eaf6; border-radius: 8px; margin: 10px 0; align-items: center; }
        .controls input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-add { background: #43A047; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-update { background: #1E88E5; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #E53935; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-refresh { background: #37474F; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #1a237e; color: white; padding: 10px; text-align: left; }
        td { padding: 8px 10px; border: 1px solid #ddd; }
        tr:nth-child(even) { background: #f5f5f5; }
        #result { background: #263238; color: #aed581; padding: 15px; border-radius: 6px; margin-top: 15px; max-height: 200px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
        .status { padding: 8px 12px; background: #e8eaf6; border-radius: 6px; margin: 5px 0; }
        .loading { color: #1a237e; padding: 20px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏋️ ระบบจัดการสมาชิกฟิตเนส</h1>

    <div class="btn-group">
        <button class="btn-sheet1" onclick="loadSheet('بيانات الأعضاء')">📊 สมาชิก</button>
        <button class="btn-sheet2" onclick="loadSheet('سجل دخول الجيم')">📅 การเข้า</button>
        <button class="btn-sheet3" onclick="loadSheet('سجل المدفوعات')">💰 การชำระเงิน</button>
        <button class="btn-sheet4" onclick="loadSheet('لوحة التحكم')">⚙️ แผงควบคุม</button>
        <button class="btn-refresh" onclick="loadSheet(currentSheet)">🔄 โหลดใหม่</button>
    </div>

    <div class="status">
        📋 ชีต: <strong id="sheetName">بيانات الأعضاء</strong> | 
        จำนวน: <span id="rowCount">0</span> แถว
    </div>

    <div class="controls">
        <span style="font-weight:bold;">✏️ จัดการ:</span>
        <input type="text" id="rowIndex" placeholder="แถวที่ (0,1,2...)" style="width:80px;">
        <input type="text" id="inputData" placeholder="ข้อมูล คั่นด้วย , เช่น สินค้า,100,ชิ้น" style="flex:1; min-width:150px;">
        <button class="btn-add" onclick="addRow()">➕ เพิ่ม</button>
        <button class="btn-update" onclick="updateRow()">✏️ แก้ไข</button>
        <button class="btn-delete" onclick="deleteRow()">🗑️ ลบ</button>
    </div>

    <div id="tableContainer"><div class="loading">⏳ กำลังโหลด...</div></div>
    <details><summary style="cursor:pointer; padding:10px; background:#e8eaf6; border-radius:6px; margin-top:10px;">📄 แสดง JSON</summary>
        <div id="result">รอข้อมูล...</div>
    </details>
</div>

<script>
const PROXY_URL = 'https://soft-hat-639a.hem5426.workers.dev/api/data';
const API_SECRET = 'MySuperSecretKey84265!@#';
let currentSheet = 'بيانات الأعضاء';

async function loadSheet(sheetName) {
    currentSheet = sheetName;
    document.getElementById('sheetName').textContent = sheetName;
    document.getElementById('tableContainer').innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';

    try {
        const url = `${PROXY_URL}?sheet=${encodeURIComponent(sheetName)}`;
        const res = await fetch(url, { headers: { 'X-API-Secret': API_SECRET } });
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);

        if (data.success && data.data) {
            renderTable(data.data);
            document.getElementById('rowCount').textContent = data.data.length;
        } else {
            document.getElementById('tableContainer').innerHTML = `<div style="color:red;">❌ ${data.error || 'ไม่พบข้อมูล'}</div>`;
        }
    } catch (e) {
        document.getElementById('tableContainer').innerHTML = `<div style="color:red;">❌ ${e.message}</div>`;
    }
}

function renderTable(data) {
    if (!data || data.length === 0) {
        document.getElementById('tableContainer').innerHTML = '<div>📭 ไม่มีข้อมูล</div>';
        return;
    }
    let html = '<table><thead><tr>';
    data[0].forEach(h => html += `<th>${h || ''}</th>`);
    html += '</tr></thead><tbody>';
    for (let i = 1; i < data.length; i++) {
        html += '<tr>';
        data[i].forEach(c => html += `<td>${c || ''}</td>`);
        html += '</tr>';
    }
    html += '</tbody></table>';
    document.getElementById('tableContainer').innerHTML = html;
}

async function addRow() {
    const input = document.getElementById('inputData').value.trim();
    if (!input) return alert('กรุณากรอกข้อมูล');
    const rowData = input.split(',').map(x => x.trim());
    try {
        const url = `${PROXY_URL}?sheet=${encodeURIComponent(currentSheet)}`;
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-API-Secret': API_SECRET },
            body: JSON.stringify({ rowData })
        });
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        if (data.success) { alert('✅ เพิ่มสำเร็จ!'); loadSheet(currentSheet); }
        else alert('❌ ' + data.error);
    } catch (e) { alert('❌ ' + e.message); }
}

async function updateRow() {
    const index = parseInt(document.getElementById('rowIndex').value);
    const input = document.getElementById('inputData').value.trim();
    if (isNaN(index)) return alert('กรุณาระบุแถว');
    if (!input) return alert('กรุณากรอกข้อมูล');
    const rowData = input.split(',').map(x => x.trim());
    try {
        const url = `${PROXY_URL}/${index}?sheet=${encodeURIComponent(currentSheet)}`;
        const res = await fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-API-Secret': API_SECRET },
            body: JSON.stringify({ rowData })
        });
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        if (data.success) { alert('✅ แก้ไขสำเร็จ!'); loadSheet(currentSheet); }
        else alert('❌ ' + data.error);
    } catch (e) { alert('❌ ' + e.message); }
}

async function deleteRow() {
    const index = parseInt(document.getElementById('rowIndex').value);
    if (isNaN(index)) return alert('กรุณาระบุแถว');
    if (!confirm(`⚠️ ลบแถวที่ ${index}?`)) return;
    try {
        const url = `${PROXY_URL}/${index}?sheet=${encodeURIComponent(currentSheet)}`;
        const res = await fetch(url, {
            method: 'DELETE',
            headers: { 'X-API-Secret': API_SECRET }
        });
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        if (data.success) { alert('✅ ลบสำเร็จ!'); loadSheet(currentSheet); }
        else alert('❌ ' + data.error);
    } catch (e) { alert('❌ ' + e.message); }
}

window.onload = () => loadSheet('بيانات الأعضاء');
</script>
</body>
</html>
